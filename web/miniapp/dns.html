<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>DNS</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <div id="hdr"></div>
    <div id="badge-slot"></div>
    <p class="muted" id="hint"></p>
    <div class="card">
      <label class="field" id="lbl-host" for="host"></label>
      <input id="host" type="text" placeholder="example.com" autocomplete="off" />
      <div class="btn-row" id="type-row"></div>
      <button type="button" class="btn secondary" id="btn-server"></button>
      <div id="out" class="result">—</div>
      <div id="copy-wrap"></div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    T2R.initApp();
    const en = T2R.lang() === "en";
    T2R.shell(en ? "DNS lookup" : "جستجوی DNS", "index.html");
    document.getElementById("badge-slot").appendChild(T2R.badge("device"));
    document.getElementById("hint").textContent = en
      ? "Resolved via Cloudflare DoH from your network."
      : "از طریق Cloudflare DoH روی شبکهٔ شما resolve می‌شود.";
    document.getElementById("lbl-host").textContent = en ? "Hostname" : "نام میزبان";
    document.getElementById("btn-server").textContent = en
      ? "Compare with bot server"
      : "مقایسه با سرور ربات";

    const types = ["A", "AAAA", "MX", "NS", "TXT", "CNAME", "SOA"];
    const row = document.getElementById("type-row");
    const out = document.getElementById("out");
    const hostEl = document.getElementById("host");
    let lastType = "A";

    types.forEach((type, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn" + (i ? " secondary" : "");
      b.textContent = type;
      b.onclick = () => {
        lastType = type;
        row.querySelectorAll(".btn").forEach((x) => x.classList.add("secondary"));
        b.classList.remove("secondary");
        run(type);
      };
      row.appendChild(b);
    });

    async function formatDoh(name, type) {
      const j = await T2R.dnsQuery(name, type);
      const answers = j.Answer || [];
      if (!answers.length) {
        return (en ? "No " : "بدون ") + type + (en ? " records." : ".");
      }
      return answers
        .map((a) => type + "  TTL=" + a.TTL + "  " + (a.data || a.name || ""))
        .join("\n");
    }

    async function run(type) {
      const name = hostEl.value.trim();
      if (!name) {
        T2R.setResult(out, en ? "Enter a hostname." : "نام میزبان را وارد کنید.", "error");
        return;
      }
      T2R.setResult(out, T2R.t("loading"), "loading");
      try {
        const text = await formatDoh(name, type);
        T2R.setResult(out, text, "ok");
        document.getElementById("copy-wrap").innerHTML = "";
        T2R.addCopyButton(document.getElementById("copy-wrap"), () => out.textContent);
      } catch (e) {
        T2R.setResult(out, T2R.t("error") + ": " + e, "error");
      }
    }

    document.getElementById("btn-server").onclick = async () => {
      const name = hostEl.value.trim();
      if (!name) {
        T2R.setResult(out, en ? "Enter a hostname." : "نام میزبان را وارد کنید.", "error");
        return;
      }
      T2R.setResult(out, T2R.t("loading"), "loading");
      let client = "";
      let server = "";
      try {
        client = await formatDoh(name, lastType);
      } catch (e) {
        client = String(e.message || e);
      }
      try {
        const j = await T2R.miniappApi("dns", { q: name, type: lastType });
        server = j.ok ? j.text : j.error || "?";
      } catch (e) {
        server = T2R.t("api_fail") + "\n" + e;
      }
      const html =
        '<div class="compare-grid">' +
        '<div class="compare-col"><h3>' +
        T2R.t("device") +
        ' (DoH)</h3><pre class="mono">' +
        client.replace(/</g, "&lt;") +
        "</pre></div>" +
        '<div class="compare-col"><h3>' +
        T2R.t("server") +
        '</h3><pre class="mono">' +
        String(server).replace(/</g, "&lt;") +
        "</pre></div></div>";
      T2R.setResultHtml(out, html, "ok");
      document.getElementById("copy-wrap").innerHTML = "";
      T2R.addCopyButton(
        document.getElementById("copy-wrap"),
        () => "DEVICE\n" + client + "\n\nSERVER\n" + server
      );
    };
  </script>
</body>
</html>

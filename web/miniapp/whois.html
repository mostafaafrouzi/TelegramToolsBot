<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Whois</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <div id="hdr"></div>
    <div id="badge-slot"></div>
    <p class="muted" id="hint"></p>
    <div class="card">
      <label class="field" for="q" id="lbl"></label>
      <input id="q" type="text" placeholder="8.8.8.8 or example.com" autocomplete="off" />
      <button type="button" class="btn" id="btn-run"></button>
      <div id="out" class="result">—</div>
      <div id="copy-wrap"></div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    T2R.initApp();
    const en = T2R.lang() === "en";
    T2R.shell(en ? "Whois / RDAP" : "Whois", "index.html");
    document.getElementById("badge-slot").appendChild(T2R.badge("server"));
    document.getElementById("hint").textContent = T2R.t("from_vps");
    document.getElementById("lbl").textContent = en ? "IP or domain" : "IP یا دامنه";
    document.getElementById("btn-run").textContent = en ? "Lookup" : "جستجو";
    const out = document.getElementById("out");

    document.getElementById("btn-run").onclick = async () => {
      const q = document.getElementById("q").value.trim();
      if (!q) {
        T2R.setResult(out, en ? "Enter IP or domain." : "IP یا دامنه را وارد کنید.", "error");
        return;
      }
      T2R.setResult(out, T2R.t("loading"), "loading");
      try {
        const j = await T2R.miniappApi("whois", { q });
        T2R.setResult(out, j.ok ? j.text : j.error || "?", j.ok ? "ok" : "error");
        document.getElementById("copy-wrap").innerHTML = "";
        if (j.ok) T2R.addCopyButton(document.getElementById("copy-wrap"), () => out.textContent);
      } catch (e) {
        T2R.setResult(out, T2R.t("api_fail") + "\n" + e, "error");
      }
    };
  </script>
</body>
</html>

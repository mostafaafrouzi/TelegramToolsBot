<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HTTP Headers</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="common.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <div id="hdr"></div>
    <div id="badge-slot"></div>
    <p class="muted" id="hint"></p>
    <div class="card">
      <label class="field" for="url" id="lbl"></label>
      <input id="url" type="url" placeholder="https://example.com" />
      <div class="btn-row">
        <button type="button" class="btn" id="btn-h"></button>
        <button type="button" class="btn secondary" id="btn-s"></button>
      </div>
      <div id="out" class="result">—</div>
      <div id="copy-wrap"></div>
    </div>
  </div>
  <script src="common.js"></script>
  <script>
    T2R.initApp();
    const en = T2R.lang() === "en";
    T2R.shell(en ? "HTTP Headers" : "هدرهای HTTP", "index.html");
    document.getElementById("badge-slot").appendChild(T2R.badge("server"));
    document.getElementById("hint").textContent = T2R.t("from_vps");
    document.getElementById("lbl").textContent = en ? "URL" : "آدرس";
    document.getElementById("btn-h").textContent = en ? "Headers" : "هدرها";
    document.getElementById("btn-s").textContent = en ? "Site status" : "وضعیت سایت";
    const out = document.getElementById("out");

    async function run(action) {
      const url = document.getElementById("url").value.trim();
      if (!url) {
        T2R.setResult(out, en ? "Enter a URL." : "آدرس را وارد کنید.", "error");
        return;
      }
      T2R.setResult(out, T2R.t("loading"), "loading");
      try {
        const j = await T2R.miniappApi(action, { url });
        T2R.setResult(out, j.ok ? j.text : j.error || "?", j.ok ? "ok" : "error");
        document.getElementById("copy-wrap").innerHTML = "";
        if (j.ok) T2R.addCopyButton(document.getElementById("copy-wrap"), () => out.textContent);
      } catch (e) {
        T2R.setResult(out, T2R.t("api_fail") + "\n" + e, "error");
      }
    }

    document.getElementById("btn-h").onclick = () => run("headers");
    document.getElementById("btn-s").onclick = () => run("status");
  </script>
</body>
</html>
